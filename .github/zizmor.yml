# zizmor configuration: the `zizmor` job in verify.yml reads it. Every audit runs except the one below;
# disabling one is a decision, so each says why.
rules:
  # GitHub's `uses: $/...` form for local actions and workflows (July 2026) is newer than the pinned
  # actionlint (scripts/tools/tools.json), so `./` stays. Revisit when an actionlint release supports `$/`.
  self-repository:
    disable: true
