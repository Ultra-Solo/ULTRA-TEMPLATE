# Template-only: init deletes this workflow.
#
# The template is only as good as what it generates, so this generates a project from every preset
# and runs that project's own setup and verify, which lints its workflows too. A marker in the wrong place, a feature that silently
# depends on another, or a workflow that stops parsing once a block is removed fails here, before
# anyone creates a repository from it.
name: template-test

on:
  # verify calls this on pull requests, main pushes and merge queue entries, and requires its result.
  workflow_call:
  # Weekly even with no commits: a runner image, a toolchain release or a registry can break a
  # generated project while the template itself stands still, and a template is judged by what it
  # generates on the day someone uses it.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The presets come from template/features.json, so adding one there adds it here with no edit.
  presets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      presets: ${{ steps.list.outputs.presets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Every preset
        id: list
        run: echo "presets=$(node -p 'JSON.stringify(Object.keys(require("./template/features.json").presets))')" >> "$GITHUB_OUTPUT"

  preset:
    name: preset (${{ matrix.preset }})
    needs: presets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.presets.outputs.presets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # In place, on this job's own fresh checkout — exactly what an adopter runs after "Use this
      # template". The unit tests cover --out; this covers the path people actually take.
      - name: Initialize in place
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          node template/init.mjs --name demo-app --owner octo-org --preset "$PRESET"
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "chore: initialize project"
          test ! -e template || { echo "::error::template/ survived initialization"; exit 1; }

      # Only the toolchains the generated project's own modules need, read from their module.json.
      - name: Toolchains this project needs
        id: needs
        run: |
          node scripts/modules.mjs toolchains --github-output
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.needs.outputs.go == 'true'
        with:
          go-version-file: ${{ steps.needs.outputs.go-version-file }}
          cache: false
      # Every pinned tool the project's checks run, as a contributor installs them: the chassis's
      # (actionlint, zizmor) and its toolchains' (golangci-lint with Go, uv with Python). verify fails in CI on a check
      # it would skip for want of one, so a tool missing here would fail the preset, not pass it unchecked.
      - name: The pinned tools this project runs
        run: node scripts/tools.mjs install --local

      - name: Install and verify the initialized project
        run: |
          node scripts/setup.mjs
          node scripts/verify.mjs
