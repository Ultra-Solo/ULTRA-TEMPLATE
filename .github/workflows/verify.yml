# The one required status check.
#
# Every job below feeds the final `verify` job, and branch protection names only that job. A
# required check is matched by job name, so adding, renaming or removing a module job never means
# editing protection rules — and never leaves pull requests waiting for a check that no longer runs.
# A new job must also be listed under `verify.needs`, or it is not part of the gate.
#
# Every module job is its checkout and .github/actions/module, which reads the module's module.json and
# runs the same scripts/verify.mjs a contributor runs, so CI and local verify check the same things.
#
# Third-party actions are pinned to a commit SHA with the version in a trailing comment. A tag can
# be repointed at different code with no diff in this repository (tj-actions/changed-files, March
# 2025); a SHA cannot. Dependabot bumps SHA and comment together, and scripts/check-hygiene.mjs
# fails the build on an unpinned `uses:`.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are cancelled; a run on main is a record of main and is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Hygiene, documentation, the chassis's own tests and its pinned tools (actionlint with shellcheck, and
  # zizmor offline), as `verify.mjs --no-modules` runs them locally. The tools come from tools.json alone,
  # and verify fails here on one it cannot find, so no second job restates how to run them.
  chassis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/tools.mjs install --for chassis
      - run: node scripts/verify.mjs --no-modules

  # The chassis is written to run on Windows too (no make, no symlinks, npm through a shell), and a
  # claim nothing runs is a claim nobody keeps. Only the chassis: the modules' own toolchains are
  # checked on Linux, where CI and the container images run them.
  chassis-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/verify.mjs --no-modules

  # scripts/agent-env.mjs prepares a coding agent's cloud session, and may run on a Node older than
  # .node-version names, since it is what installs that one. This runs it there, from nothing, then checks
  # the chassis with only what it set up on PATH.
  agent-env:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: The oldest Node it runs on
        id: oldest
        run: echo "node=$(node scripts/agent-env.mjs --oldest-node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.oldest.outputs.node }}
      - name: Prepare a session, then verify the chassis with only what it set up
        env:
          CLAUDE_ENV_FILE: ${{ runner.temp }}/claude-env
        run: |
          node --version
          node scripts/agent-env.mjs --force
          # The file is written by the line above, so shellcheck cannot follow it.
          # shellcheck source=/dev/null
          . "$CLAUDE_ENV_FILE"
          node scripts/verify.mjs --no-modules

  # zizmor audits the workflows for security rather than syntax: template injection, dangerous
  # triggers, persisted credentials, cache poisoning. The chassis job runs its offline audits; this one has
  # a token, so it also confirms each pinned SHA belongs to the repository it names, so an impostor commit
  # from a fork cannot pass as a pin.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tool
        with:
          names: zizmor
      - run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }}

  # No secret in the commits this change adds. It blocks, unlike the history scan in security.yml: a
  # token committed to a public repository is harvested within minutes, and GitHub's own secret scanning
  # blocks a push only on a public repository or with GitHub Advanced Security. A false positive goes in
  # .gitleaksignore by fingerprint, with the reason (SECURITY.md).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/tool
        with:
          names: gitleaks
      - name: Scan this change's commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            merge_group) range="${QUEUE_BASE}..${QUEUE_HEAD}" ;;
            # A push names what was there before it; a new branch or a manual run has no before, so
            # the commit itself is the change.
            *) if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]]; then range="${BEFORE}..${SHA}"; else range="-1 ${SHA}"; fi ;;
          esac
          echo "Scanning ${range}"
          gitleaks git --no-banner --redact --exit-code 1 "--log-opts=${range}" .

  # ultra:begin go-service
  go-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/module
        with:
          id: go-service
  # ultra:end go-service

  # ultra:begin ts-service
  ts-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/module
        with:
          id: ts-service
  # ultra:end ts-service

  # ultra:begin mcp-server
  mcp-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/module
        with:
          id: mcp-server
  # ultra:end mcp-server

  # ultra:begin py-service
  py-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/module
        with:
          id: py-service

  # Native hosts exercise the patched runtime without emulation; both results feed verify.
  py-image-security:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/tools.mjs install --local trivy
      - name: Build and exercise the real Python image
        run: node scripts/probe-image.mjs py-service --full-contract
      - name: Retain the complete vulnerability report
        run: |
          trivy image --scanners vuln --ignorefile .trivyignore \
            --cache-dir "$RUNNER_TEMP/trivy-cache" --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --format json --output "$RUNNER_TEMP/python-image.json" py-service:probe
      - name: Reject fixable high or critical Python runtime findings
        env:
          REPORT: ${{ runner.temp }}/python-image.json
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(process.env.REPORT, "utf8"));
          if (!Array.isArray(report.Results)) throw new Error("No complete scan results");
          const findings = report.Results.flatMap(r => r.Vulnerabilities ?? [])
            .filter(v => ["HIGH", "CRITICAL"].includes(v.Severity) && v.FixedVersion);
          console.log(`Fixable high/critical runtime findings: ${findings.length}`);
          if (findings.length) {
            console.error(findings.map(v => `${v.VulnerabilityID}: ${v.PkgName} ${v.InstalledVersion} -> ${v.FixedVersion}`).join("\n"));
            process.exitCode = 1;
          }
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-image-${{ matrix.runner }}
          path: ${{ runner.temp }}/python-image.json
          if-no-files-found: warn
          retention-days: 14
  # ultra:end py-service

  # ultra:begin web
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/module
        with:
          id: web
  # ultra:end web

  # ultra:begin ts-library
  ts-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/module
        with:
          id: ts-library
  # ultra:end ts-library

  # ultra:begin architecture
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/module
        with:
          id: architecture
  # ultra:end architecture

  # ultra:begin devcontainer
  devcontainer-scan:
    uses: ./.github/workflows/devcontainer-scan.yml
  # ultra:end devcontainer

  # ultra:begin template
  # The release recorded by init is the updater's baseline; output changes must advance it.
  template-release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Check generated output against the event's base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: node template/check-release.mjs
      - name: Default bootstrap resolves a known published upstream release
        run: node template/check-publication.mjs

  # Full generated-project verification is part of the required gate, not a separate advisory run.
  template-presets:
    uses: ./.github/workflows/template-test.yml
  # ultra:end template

  verify:
    if: always()
    needs:
      - chassis
      - chassis-windows
      - agent-env
      - zizmor
      - secrets
      # ultra:begin template
      - template-release-check
      - template-presets
      # ultra:end template
      # ultra:begin go-service
      - go-service
      # ultra:end go-service
      # ultra:begin ts-service
      - ts-service
      # ultra:end ts-service
      # ultra:begin mcp-server
      - mcp-server
      # ultra:end mcp-server
      # ultra:begin py-service
      - py-service
      - py-image-security
      # ultra:end py-service
      # ultra:begin web
      - web
      # ultra:end web
      # ultra:begin ts-library
      - ts-library
      # ultra:end ts-library
      # ultra:begin architecture
      - architecture
      # ultra:end architecture
      # ultra:begin devcontainer
      - devcontainer-scan
      # ultra:end devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `if: always()` makes this job report even when a dependency failed or was cancelled, so the
      # check is red rather than missing. It is green only when every dependency succeeded.
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
