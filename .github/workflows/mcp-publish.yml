# Publishes the MCP server where clients can find it: the image to GitHub Container Registry, then
# services/mcp-server/server.json to the official MCP Registry. Neither step stores a token — the image
# is pushed with this run's GITHUB_TOKEN, and the registry trusts GitHub's OIDC identity for the
# io.github.<owner>/ namespace.
#
# The image is built for linux/amd64 and linux/arm64, each on a native runner, and published as one tag.
# An MCP server usually runs on the developer's own machine, and an amd64-only image runs emulated on an
# Apple Silicon Mac, if at all.
#
# Off until the repository variable MCP_PUBLISH_ENABLED is set to true; services/mcp-server/README.md
# lists the one-time steps first.
name: mcp-publish

on:
  # release.yml calls this once release-please has created a release: a release made with GITHUB_TOKEN
  # starts no workflow by itself. Running it by hand publishes a version released earlier.
  workflow_call:
    inputs:
      version:
        description: The release to publish, such as v1.2.0.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 1.2.0. The tag v1.2.0 must already exist.
        required: true

permissions:
  contents: read

jobs:
  release:
    if: vars.MCP_PUBLISH_ENABLED == 'true'
    # A deployment environment on the first job holds the whole publish: a required reviewer or a
    # limit on which refs may publish, set in the environment's settings, applies before anything is built.
    environment: mcp-registry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Every later job checks out this tag. A tag can be created only by someone with write access.
      - name: Check the release exists
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          TAG="v${INPUT#v}"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::There is no tag $TAG. Publish a version that has been released."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  image:
    needs: release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Build and push the ${{ matrix.arch }} image
        working-directory: services/mcp-server
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Image references must be lowercase; a GitHub owner need not be.
          IMAGE="ghcr.io/${OWNER,,}/ultra-template-mcp-server:$VERSION-$ARCH"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # The image reports the release it is (src/config.ts reads MCP_SERVER_VERSION); check that it does.
          docker build --build-arg VERSION="$VERSION" --tag "$IMAGE" .
          test "$(docker run --rm --entrypoint node "$IMAGE" -p process.env.MCP_SERVER_VERSION)" = "$VERSION"
          docker push "$IMAGE"

  publish:
    needs: [release, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Publish both images under one tag
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="ghcr.io/${OWNER,,}/ultra-template-mcp-server"
          IMAGE="$NAME:$VERSION"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # An index naming the two images: a client pulls the one built for its own architecture.
          docker buildx imagetools create --tag "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
          docker buildx imagetools inspect "$IMAGE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # A signed statement of which workflow run, at which commit, built the published image, stored in
      # the registry beside it: `gh attestation verify oci://IMAGE --owner OWNER` checks it. GitHub offers
      # attestations to public repositories, and to private ones only on GitHub Enterprise Cloud, where
      # ATTESTATIONS_ENABLED=true turns this on.
      - name: Attest the image's build provenance
        if: ${{ !github.event.repository.private || vars.ATTESTATIONS_ENABLED == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.name }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - uses: ./.github/actions/tool
        with:
          names: mcp-publisher

      - name: Publish server.json to the MCP Registry
        working-directory: services/mcp-server
        run: |
          IMAGE="ghcr.io/${OWNER,,}/ultra-template-mcp-server:$VERSION"
          # The committed manifest names the image by pattern; publish the exact one just pushed. The
          # registry reads the label from the linux/amd64 image in the index, which carries it like the other.
          jq --arg v "$VERSION" --arg image "$IMAGE" \
            '.version = $v | .packages[0].identifier = $image' server.json > server.tmp
          mv server.tmp server.json
          mcp-publisher login github-oidc
          mcp-publisher publish
