# The environment GitHub's Copilot coding agent prepares before it works on this repository.
# The Dev Container does this for an agent running on a developer's machine; this does it for the
# one running in GitHub's. An agent that cannot install dependencies cannot run `verify`, and an
# agent that cannot run `verify` will report work it did not check.
name: Copilot setup steps

on:
  workflow_dispatch:
  # Changing the setup is the one case where running it is the only way to know it still works.
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  # The job id must be exactly this, or Copilot does not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # The toolchains the modules present need, from their module.json, and tools at the versions
      # scripts/tools/tools.json pins: nothing here names a feature or a version.
      - name: Toolchains this repository needs
        id: needs
        run: |
          node scripts/modules.mjs toolchains --github-output
      # No cache: this job builds little, and under the same key as the go-service job it would save a
      # near-empty cache that the go-service job then restores instead of its own.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.needs.outputs.go == 'true'
        with:
          go-version-file: ${{ steps.needs.outputs.go-version-file }}
          cache: false
      # First, since setup installs a Python module's dependencies with the pinned uv.
      - name: Install the tools local checks use
        run: node scripts/tools.mjs install --local
      - name: Install every module's dependencies
        run: node scripts/setup.mjs
