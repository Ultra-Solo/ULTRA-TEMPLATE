# Which hand-pinned tools have a newer release (report-only), and whether every pinned checksum is the
# one its release publishes (a failure when it is not).
#
# Dependabot moves actions, base images and module dependencies. The tools downloaded by version and
# checksum in the workflows it cannot see, so each would go stale without anyone deciding it should.
# This lists them weekly in the job summary. It never moves a pin: that takes reading the release and
# taking its checksum from it (docs/toolchain-updates.md). It fails only when a lookup could not be made.
#
# The checksums job reads every platform's pinned SHA-256 against the release, on each pull request that
# changes a pin and weekly. CI installs only the linux-x64 assets, so without it an arm64 or macOS pin
# is first tried on someone's machine. It stays outside the verify gate: it depends on hosts this
# repository does not run, and a pull request that changes no pin cannot break it.
name: pins

on:
  schedule:
    - cron: "23 6 * * 2"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/tools/**
      - scripts/tools.mjs
      - scripts/check-pins.mjs
      - .github/workflows/pins.yml

permissions:
  contents: read

jobs:
  report:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Hand-pinned tools against their latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        # `shell: bash` runs with pipefail, so a lookup that failed fails the step through the pipe.
        shell: bash
        run: node scripts/check-pins.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  checksums:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Every pinned checksum against its release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/check-pins.mjs --checksums | tee -a "$GITHUB_STEP_SUMMARY"
